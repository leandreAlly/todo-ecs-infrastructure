template-file-path: packaged/main.yaml
parameters:
  ProjectName: todo-ecs
  S3PrefixListId: pl-c3aa4faa
  GitHubOwner: leandreAlly
  ApplicationRepo: todo-ecs-app
  GitHubOwnerId: '78492995'
  RepositoryName: todo-ecs-app
  # The only tag the application workflow publishes. Empty on a first create,
  # when the registry does not exist yet.
  ImageTag: latest
  # lab-conn, set directly so the root stack stops importing the bootstrap
  # export while that export moves off the PENDING todo-ecs-github connection.
  ConnectionArn: arn:aws:codeconnections:eu-north-1:842676015206:connection/e10051fb-c117-4f51-8512-e3f7364b371d
  # Revision the ECS service should keep running. Empty on a first create;
  # pin it to what CodeDeploy last registered once the service is live, or
  # CloudFormation will try to move the service itself and ECS will refuse.
  ServiceTaskDefinitionArn: arn:aws:ecs:eu-north-1:842676015206:task-definition/todo-ecs:5
  TestListenerCidr: 127.0.0.1/32
tags:
  project: todo-ecs
  lab: advanced-ecs
  owner: leandre
  managed-by: cloudformation-gitsync
