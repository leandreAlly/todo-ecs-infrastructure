AWSTemplateFormatVersion: '2010-09-09'
Description: "To-Do ECS - root stack. Nests every child stack for this project. Child\
  \ templates are referenced by local path here; \"aws cloudformation package\" rewrites\
  \ each TemplateURL to a content-hashed S3 object, so a nested stack only updates\
  \ when its own template changes. Deploy this stack, never its children.\n"
Parameters:
  ProjectName:
    Type: String
    Default: todo-ecs
    AllowedPattern: '[a-z][a-z0-9-]*'
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
  PublicSubnet1Cidr:
    Type: String
    Default: 10.0.0.0/24
  PublicSubnet2Cidr:
    Type: String
    Default: 10.0.1.0/24
  AppSubnet1Cidr:
    Type: String
    Default: 10.0.10.0/24
  AppSubnet2Cidr:
    Type: String
    Default: 10.0.11.0/24
  DataSubnet1Cidr:
    Type: String
    Default: 10.0.20.0/24
  DataSubnet2Cidr:
    Type: String
    Default: 10.0.21.0/24
  CacheSubnet1Cidr:
    Type: String
    Default: 10.0.30.0/24
  CacheSubnet2Cidr:
    Type: String
    Default: 10.0.31.0/24
  ContainerPort:
    Type: Number
    Default: 8080
  TestListenerPort:
    Type: Number
    Default: 9000
  TestListenerCidr:
    Type: String
    Default: 127.0.0.1/32
    Description: Operator public CIDR allowed to reach the CodeDeploy test 
      listener; override with the current public IP/32.
  DatabasePort:
    Type: Number
    Default: 5432
  CachePort:
    Type: Number
    Default: 6379
  S3PrefixListId:
    Type: String
    AllowedPattern: ^pl-[0-9a-f]+$
  GitHubOwner:
    Type: String
    Default: leandreAlly
  ApplicationRepo:
    Type: String
    Default: todo-ecs-app
  GitHubOwnerId:
    Type: String
    Default: '78492995'
    AllowedPattern: '[0-9]+'
    Description: "Numeric GitHub owner ID. Repositories created after 2026-07-15 emit\
      \ an immutable OIDC subject claim of the form repo:owner@ownerid/repo@repoid:ref:...\
      \ instead of repo:owner/repo:ref:...\n"
  RepositoryName:
    Type: String
    Default: todo-ecs-app
  ConnectionArn:
    Type: String
    Default: ''
    AllowedPattern: 
      ^$|^arn:aws(-[a-z]+)*:(codestar-connections|codeconnections):[a-z0-9-]+:[0-9]{12}:connection/[a-f0-9-]+$
    Description: "GitHub connection the pipeline reads the application repository\
      \ through. Empty imports the one the bootstrap stack exports. Setting it releases\
      \ that import, which is what lets the bootstrap stack change its export.\n"
  ServiceTaskDefinitionArn:
    Type: String
    Default: ''
    Description: "Task definition revision the ECS service should keep running. Empty\
      \ on the first create; pin it to the revision CodeDeploy last registered so\
      \ that later template edits cannot try to move the service themselves - ECS\
      \ rejects that on a CODE_DEPLOY service.\n"
  ImageTag:
    Type: String
    Default: ''
    Description: "Image tag to run - \"latest\", the only tag the application workflow\
      \ publishes. Leave empty on the first deploy - the platform stack is only created\
      \ once an image exists in the registry, because an ECS service cannot start\
      \ without a real image to pull. The data stack is deliberately outside this\
      \ condition so the database and cache are already warm by the time the first\
      \ image lands.\n"
  DbName:
    Type: String
    Default: todo
  DbEngineVersion:
    Type: String
    Default: '17.6'
  DbInstanceClass:
    Type: String
    Default: db.t3.micro
  DbAllocatedStorage:
    Type: Number
    Default: 20
  DbMultiAZ:
    Type: String
    Default: 'true'
    AllowedValues:
    - 'true'
    - 'false'
  DbBackupRetentionDays:
    Type: Number
    Default: 1
  CacheNodeType:
    Type: String
    Default: cache.t4g.micro
  CacheEngineVersion:
    Type: String
    Default: '7.1'
  CacheClusterCount:
    Type: Number
    Default: 2
    MinValue: 2
  TaskCpu:
    Type: String
    Default: '512'
  TaskMemory:
    Type: String
    Default: '1024'
  MinCapacity:
    Type: Number
    Default: 1
  MaxCapacity:
    Type: Number
    Default: 4
  CpuTargetUtilization:
    Type: Number
    Default: 60
Conditions:
  HasImage:
    Fn::Not:
    - Fn::Equals:
      - Ref: ImageTag
      - ''
  HasConnectionArn:
    Fn::Not:
    - Fn::Equals:
      - Ref: ConnectionArn
      - ''
Resources:
  Network:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 
        https://s3.eu-north-1.amazonaws.com/todo-ecs-templates-842676015206-eu-north-1/nested-stacks/6c65635e53c46edaa01357b07a155da5.template
      Parameters:
        ProjectName:
          Ref: ProjectName
        VpcCidr:
          Ref: VpcCidr
        PublicSubnet1Cidr:
          Ref: PublicSubnet1Cidr
        PublicSubnet2Cidr:
          Ref: PublicSubnet2Cidr
        AppSubnet1Cidr:
          Ref: AppSubnet1Cidr
        AppSubnet2Cidr:
          Ref: AppSubnet2Cidr
        DataSubnet1Cidr:
          Ref: DataSubnet1Cidr
        DataSubnet2Cidr:
          Ref: DataSubnet2Cidr
        CacheSubnet1Cidr:
          Ref: CacheSubnet1Cidr
        CacheSubnet2Cidr:
          Ref: CacheSubnet2Cidr
        ContainerPort:
          Ref: ContainerPort
        TestListenerPort:
          Ref: TestListenerPort
        TestListenerCidr:
          Ref: TestListenerCidr
        DatabasePort:
          Ref: DatabasePort
        CachePort:
          Ref: CachePort
        S3PrefixListId:
          Ref: S3PrefixListId
      Tags:
      - Key: nested-stack
        Value: network
  Registry:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 
        https://s3.eu-north-1.amazonaws.com/todo-ecs-templates-842676015206-eu-north-1/nested-stacks/f030cea8f166d9c550c850355b593d19.template
      Parameters:
        ProjectName:
          Ref: ProjectName
        RepositoryName:
          Ref: RepositoryName
        GitHubOwner:
          Ref: GitHubOwner
        GitHubOwnerId:
          Ref: GitHubOwnerId
        GitHubRepo:
          Ref: ApplicationRepo
      Tags:
      - Key: nested-stack
        Value: registry
  Data:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 
        https://s3.eu-north-1.amazonaws.com/todo-ecs-templates-842676015206-eu-north-1/nested-stacks/b749805b8e1911443ae705908b55dc92.template
      Parameters:
        ProjectName:
          Ref: ProjectName
        DataSubnetIds:
          Fn::GetAtt:
          - Network
          - Outputs.DataSubnetIds
        CacheSubnetIds:
          Fn::GetAtt:
          - Network
          - Outputs.CacheSubnetIds
        DatabaseSecurityGroupId:
          Fn::GetAtt:
          - Network
          - Outputs.DatabaseSecurityGroupId
        ProxySecurityGroupId:
          Fn::GetAtt:
          - Network
          - Outputs.ProxySecurityGroupId
        CacheSecurityGroupId:
          Fn::GetAtt:
          - Network
          - Outputs.CacheSecurityGroupId
        DbName:
          Ref: DbName
        DbPort:
          Ref: DatabasePort
        DbEngineVersion:
          Ref: DbEngineVersion
        DbInstanceClass:
          Ref: DbInstanceClass
        DbAllocatedStorage:
          Ref: DbAllocatedStorage
        DbMultiAZ:
          Ref: DbMultiAZ
        DbBackupRetentionDays:
          Ref: DbBackupRetentionDays
        CacheNodeType:
          Ref: CacheNodeType
        CacheEngineVersion:
          Ref: CacheEngineVersion
        CacheClusterCount:
          Ref: CacheClusterCount
        CachePort:
          Ref: CachePort
      Tags:
      - Key: nested-stack
        Value: data
  Platform:
    Type: AWS::CloudFormation::Stack
    Condition: HasImage
    Properties:
      TemplateURL: 
        https://s3.eu-north-1.amazonaws.com/todo-ecs-templates-842676015206-eu-north-1/nested-stacks/849d1f03c35df4a62ddd37588e4b3933.template
      Parameters:
        ProjectName:
          Ref: ProjectName
        VpcId:
          Fn::GetAtt:
          - Network
          - Outputs.VpcId
        PublicSubnetIds:
          Fn::GetAtt:
          - Network
          - Outputs.PublicSubnetIds
        AppSubnetIds:
          Fn::GetAtt:
          - Network
          - Outputs.AppSubnetIds
        AlbSecurityGroupId:
          Fn::GetAtt:
          - Network
          - Outputs.AlbSecurityGroupId
        TaskSecurityGroupId:
          Fn::GetAtt:
          - Network
          - Outputs.TaskSecurityGroupId
        ContainerImage:
          Fn::Sub: ${Registry.Outputs.RepositoryUri}:${ImageTag}
        ContainerPort:
          Ref: ContainerPort
        TestListenerPort:
          Ref: TestListenerPort
        DatabaseSecretArn:
          Fn::GetAtt:
          - Data
          - Outputs.DatabaseSecretArn
        RedisSecretArn:
          Fn::GetAtt:
          - Data
          - Outputs.RedisSecretArn
        CacheTls:
          Fn::GetAtt:
          - Data
          - Outputs.CacheTransitEncryption
        ServiceTaskDefinitionArn:
          Ref: ServiceTaskDefinitionArn
        TaskCpu:
          Ref: TaskCpu
        TaskMemory:
          Ref: TaskMemory
        MinCapacity:
          Ref: MinCapacity
        MaxCapacity:
          Ref: MaxCapacity
        CpuTargetUtilization:
          Ref: CpuTargetUtilization
      Tags:
      - Key: nested-stack
        Value: platform
  Delivery:
    Type: AWS::CloudFormation::Stack
    Condition: HasImage
    Properties:
      TemplateURL: 
        https://s3.eu-north-1.amazonaws.com/todo-ecs-templates-842676015206-eu-north-1/nested-stacks/e0b7a9e60fca038a10c8723ef1068029.template
      Parameters:
        ProjectName:
          Ref: ProjectName
        EcrRepositoryName:
          Fn::GetAtt:
          - Registry
          - Outputs.RepositoryName
        ClusterName:
          Fn::GetAtt:
          - Platform
          - Outputs.ClusterName
        ServiceName:
          Fn::GetAtt:
          - Platform
          - Outputs.ServiceName
        ProductionListenerArn:
          Fn::GetAtt:
          - Platform
          - Outputs.ProductionListenerArn
        TestListenerArn:
          Fn::GetAtt:
          - Platform
          - Outputs.TestListenerArn
        BlueTargetGroupName:
          Fn::GetAtt:
          - Platform
          - Outputs.BlueTargetGroupName
        GreenTargetGroupName:
          Fn::GetAtt:
          - Platform
          - Outputs.GreenTargetGroupName
        Target5xxAlarmName:
          Fn::GetAtt:
          - Platform
          - Outputs.Target5xxAlarmName
        TaskFamily:
          Ref: ProjectName
        TaskExecutionRoleArn:
          Fn::GetAtt:
          - Platform
          - Outputs.TaskExecutionRoleArn
        TaskRoleArn:
          Fn::GetAtt:
          - Platform
          - Outputs.TaskRoleArn
        ContainerPort:
          Ref: ContainerPort
        TaskCpu:
          Ref: TaskCpu
        TaskMemory:
          Ref: TaskMemory
        LogGroupName:
          Fn::GetAtt:
          - Platform
          - Outputs.LogGroupName
        DatabaseUrlParameterArn:
          Fn::GetAtt:
          - Data
          - Outputs.DatabaseUrlParameterArn
        CacheHostParameterArn:
          Fn::GetAtt:
          - Data
          - Outputs.CacheHostParameterArn
        CachePortParameterArn:
          Fn::GetAtt:
          - Data
          - Outputs.CachePortParameterArn
        DatabaseSecretArn:
          Fn::GetAtt:
          - Data
          - Outputs.DatabaseSecretArn
        RedisSecretArn:
          Fn::GetAtt:
          - Data
          - Outputs.RedisSecretArn
        CacheTls:
          Fn::GetAtt:
          - Data
          - Outputs.CacheTransitEncryption
        ConnectionArn:
          Fn::If:
          - HasConnectionArn
          - Ref: ConnectionArn
          - Fn::ImportValue:
              Fn::Sub: ${ProjectName}-github-connection-arn
        ApplicationRepositoryId:
          Fn::Sub: ${GitHubOwner}/${ApplicationRepo}
      Tags:
      - Key: nested-stack
        Value: delivery
Outputs:
  ApplicationUrl:
    Condition: HasImage
    Description: Public ALB endpoint - the lab deliverable
    Value:
      Fn::GetAtt:
      - Platform
      - Outputs.LoadBalancerUrl
  TestListenerUrl:
    Condition: HasImage
    Description: Green fleet during a blue/green shift, before traffic moves
    Value:
      Fn::GetAtt:
      - Platform
      - Outputs.TestListenerUrl
  ApplicationRoleArn:
    Description: Value for the AWS_ECR_ROLE_ARN secret in the application 
      repository
    Value:
      Fn::GetAtt:
      - Registry
      - Outputs.GitHubActionsRoleArn
  EcrRepositoryName:
    Description: Value for the ECR_REPOSITORY variable in the application 
      repository
    Value:
      Fn::GetAtt:
      - Registry
      - Outputs.RepositoryName
  TaskFamily:
    Description: family in taskdef.json
    Value:
      Ref: ProjectName
  TaskExecutionRoleArn:
    Condition: HasImage
    Description: executionRoleArn in taskdef.json
    Value:
      Fn::GetAtt:
      - Platform
      - Outputs.TaskExecutionRoleArn
  TaskRoleArn:
    Condition: HasImage
    Description: taskRoleArn in taskdef.json
    Value:
      Fn::GetAtt:
      - Platform
      - Outputs.TaskRoleArn
  LogGroupName:
    Condition: HasImage
    Description: awslogs-group in taskdef.json
    Value:
      Fn::GetAtt:
      - Platform
      - Outputs.LogGroupName
  DatabaseUrlParameterArn:
    Description: valueFrom for SPRING_DATASOURCE_URL in taskdef.json
    Value:
      Fn::GetAtt:
      - Data
      - Outputs.DatabaseUrlParameterArn
  CacheHostParameterArn:
    Description: valueFrom for SPRING_DATA_REDIS_HOST in taskdef.json
    Value:
      Fn::GetAtt:
      - Data
      - Outputs.CacheHostParameterArn
  CachePortParameterArn:
    Description: valueFrom for SPRING_DATA_REDIS_PORT in taskdef.json
    Value:
      Fn::GetAtt:
      - Data
      - Outputs.CachePortParameterArn
  DatabaseUrl:
    Description: Resolved JDBC URL - the proxy, not the instance
    Value:
      Fn::GetAtt:
      - Data
      - Outputs.DatabaseUrl
  DatabaseEndpoint:
    Description: Instance endpoint - reachable only from the proxy
    Value:
      Fn::GetAtt:
      - Data
      - Outputs.DatabaseEndpoint
  ProxyEndpoint:
    Value:
      Fn::GetAtt:
      - Data
      - Outputs.ProxyEndpoint
  CacheHost:
    Value:
      Fn::GetAtt:
      - Data
      - Outputs.CachePrimaryEndpoint
  DatabaseSecretArn:
    Description: Full ARN, for reading the credentials by hand
    Value:
      Fn::GetAtt:
      - Data
      - Outputs.DatabaseSecretArn
  RedisSecretArn:
    Value:
      Fn::GetAtt:
      - Data
      - Outputs.RedisSecretArn
  RepositoryUri:
    Description: Image URI the application workflow pushes to
    Value:
      Fn::GetAtt:
      - Registry
      - Outputs.RepositoryUri
  VpcId:
    Value:
      Fn::GetAtt:
      - Network
      - Outputs.VpcId
  ArtifactBucketName:
    Condition: HasImage
    Description: Pipeline artifact store
    Value:
      Fn::GetAtt:
      - Delivery
      - Outputs.ArtifactBucketName
  PipelineName:
    Condition: HasImage
    Value:
      Fn::GetAtt:
      - Delivery
      - Outputs.PipelineName
  ClusterName:
    Condition: HasImage
    Value:
      Fn::GetAtt:
      - Platform
      - Outputs.ClusterName
  ServiceName:
    Condition: HasImage
    Value:
      Fn::GetAtt:
      - Platform
      - Outputs.ServiceName
