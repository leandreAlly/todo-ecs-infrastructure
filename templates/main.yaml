AWSTemplateFormatVersion: '2010-09-09'
Description: >
  To-Do ECS - root stack.
  Nests every child stack for this project. Child templates are referenced by
  local path here; "aws cloudformation package" rewrites each TemplateURL to
  a content-hashed S3 object, so a nested stack only updates when its own
  template changes. Deploy this stack, never its children.

Parameters:
  ProjectName:
    Type: String
    Default: todo-ecs
    AllowedPattern: '[a-z][a-z0-9-]*'

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
  PublicSubnet1Cidr:
    Type: String
    Default: 10.0.0.0/24
  PublicSubnet2Cidr:
    Type: String
    Default: 10.0.1.0/24
  AppSubnet1Cidr:
    Type: String
    Default: 10.0.10.0/24
  AppSubnet2Cidr:
    Type: String
    Default: 10.0.11.0/24
  DataSubnet1Cidr:
    Type: String
    Default: 10.0.20.0/24
  DataSubnet2Cidr:
    Type: String
    Default: 10.0.21.0/24
  CacheSubnet1Cidr:
    Type: String
    Default: 10.0.30.0/24
  CacheSubnet2Cidr:
    Type: String
    Default: 10.0.31.0/24

  ContainerPort:
    Type: Number
    Default: 8080
  TestListenerPort:
    Type: Number
    Default: 9000
  TestListenerCidr:
    Type: String
    Default: 127.0.0.1/32
    Description: Operator public CIDR allowed to reach the CodeDeploy test listener; override with the current public IP/32.
  DatabasePort:
    Type: Number
    Default: 5432
  CachePort:
    Type: Number
    Default: 6379

  S3PrefixListId:
    Type: String
    AllowedPattern: '^pl-[0-9a-f]+$'

  GitHubOwner:
    Type: String
    Default: leandreAlly
  ApplicationRepo:
    Type: String
    Default: todo-ecs-app

  GitHubOwnerId:
    Type: String
    Default: '78492995'
    AllowedPattern: '[0-9]+'
    Description: >
      Numeric GitHub owner ID. Repositories created after 2026-07-15 emit an
      immutable OIDC subject claim of the form
      repo:owner@ownerid/repo@repoid:ref:... instead of repo:owner/repo:ref:...

  RepositoryName:
    Type: String
    Default: todo-ecs-app

  ServiceTaskDefinitionArn:
    Type: String
    Default: ''
    Description: >
      Task definition revision the ECS service should keep running. Empty on
      the first create; pin it to the revision CodeDeploy last registered so
      that later template edits cannot try to move the service themselves -
      ECS rejects that on a CODE_DEPLOY service.

  ImageTag:
    Type: String
    Default: ''
    Description: >
      Image tag to run. Leave empty on the first deploy - the platform stack
      is only created once an image exists in the registry, because an ECS
      service cannot start without a real image to pull. The data stack is
      deliberately outside this condition so the database and cache are already
      warm by the time the first image lands.

  DbName:
    Type: String
    Default: todo
  DbEngineVersion:
    Type: String
    Default: '17.6'
  DbInstanceClass:
    Type: String
    Default: db.t3.micro
  DbAllocatedStorage:
    Type: Number
    Default: 20
  DbMultiAZ:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
  DbBackupRetentionDays:
    Type: Number
    Default: 1

  CacheNodeType:
    Type: String
    Default: cache.t4g.micro
  CacheEngineVersion:
    Type: String
    Default: '7.1'
  CacheClusterCount:
    Type: Number
    Default: 2
    MinValue: 2

  TaskCpu:
    Type: String
    Default: '512'
  TaskMemory:
    Type: String
    Default: '1024'
  MinCapacity:
    Type: Number
    Default: 1
  MaxCapacity:
    Type: Number
    Default: 4
  CpuTargetUtilization:
    Type: Number
    Default: 60

Conditions:
  HasImage: !Not [!Equals [!Ref ImageTag, '']]
Resources:
  Network:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: nested-stacks/network.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        VpcCidr: !Ref VpcCidr
        PublicSubnet1Cidr: !Ref PublicSubnet1Cidr
        PublicSubnet2Cidr: !Ref PublicSubnet2Cidr
        AppSubnet1Cidr: !Ref AppSubnet1Cidr
        AppSubnet2Cidr: !Ref AppSubnet2Cidr
        DataSubnet1Cidr: !Ref DataSubnet1Cidr
        DataSubnet2Cidr: !Ref DataSubnet2Cidr
        CacheSubnet1Cidr: !Ref CacheSubnet1Cidr
        CacheSubnet2Cidr: !Ref CacheSubnet2Cidr
        ContainerPort: !Ref ContainerPort
        TestListenerPort: !Ref TestListenerPort
        TestListenerCidr: !Ref TestListenerCidr
        DatabasePort: !Ref DatabasePort
        CachePort: !Ref CachePort
        S3PrefixListId: !Ref S3PrefixListId
      Tags:
        - Key: nested-stack
          Value: network

  Registry:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: nested-stacks/registry.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        RepositoryName: !Ref RepositoryName
        GitHubOwner: !Ref GitHubOwner
        GitHubOwnerId: !Ref GitHubOwnerId
        GitHubRepo: !Ref ApplicationRepo
      Tags:
        - Key: nested-stack
          Value: registry

  Data:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: nested-stacks/data.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        DataSubnetIds: !GetAtt Network.Outputs.DataSubnetIds
        CacheSubnetIds: !GetAtt Network.Outputs.CacheSubnetIds
        DatabaseSecurityGroupId: !GetAtt Network.Outputs.DatabaseSecurityGroupId
        ProxySecurityGroupId: !GetAtt Network.Outputs.ProxySecurityGroupId
        CacheSecurityGroupId: !GetAtt Network.Outputs.CacheSecurityGroupId
        DbName: !Ref DbName
        DbPort: !Ref DatabasePort
        DbEngineVersion: !Ref DbEngineVersion
        DbInstanceClass: !Ref DbInstanceClass
        DbAllocatedStorage: !Ref DbAllocatedStorage
        DbMultiAZ: !Ref DbMultiAZ
        DbBackupRetentionDays: !Ref DbBackupRetentionDays
        CacheNodeType: !Ref CacheNodeType
        CacheEngineVersion: !Ref CacheEngineVersion
        CacheClusterCount: !Ref CacheClusterCount
        CachePort: !Ref CachePort
      Tags:
        - Key: nested-stack
          Value: data

  Platform:
    Type: AWS::CloudFormation::Stack
    Condition: HasImage
    Properties:
      TemplateURL: nested-stacks/platform.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        VpcId: !GetAtt Network.Outputs.VpcId
        PublicSubnetIds: !GetAtt Network.Outputs.PublicSubnetIds
        AppSubnetIds: !GetAtt Network.Outputs.AppSubnetIds
        AlbSecurityGroupId: !GetAtt Network.Outputs.AlbSecurityGroupId
        TaskSecurityGroupId: !GetAtt Network.Outputs.TaskSecurityGroupId
        ContainerImage: !Sub '${Registry.Outputs.RepositoryUri}:${ImageTag}'
        ContainerPort: !Ref ContainerPort
        TestListenerPort: !Ref TestListenerPort
        DatabaseSecretArn: !GetAtt Data.Outputs.DatabaseSecretArn
        RedisSecretArn: !GetAtt Data.Outputs.RedisSecretArn
        CacheTls: !GetAtt Data.Outputs.CacheTransitEncryption
        ServiceTaskDefinitionArn: !Ref ServiceTaskDefinitionArn
        TaskCpu: !Ref TaskCpu
        TaskMemory: !Ref TaskMemory
        MinCapacity: !Ref MinCapacity
        MaxCapacity: !Ref MaxCapacity
        CpuTargetUtilization: !Ref CpuTargetUtilization
      Tags:
        - Key: nested-stack
          Value: platform

  Delivery:
    Type: AWS::CloudFormation::Stack
    Condition: HasImage
    Properties:
      TemplateURL: nested-stacks/delivery.yaml
      Parameters:
        ProjectName: !Ref ProjectName
        EcrRepositoryName: !GetAtt Registry.Outputs.RepositoryName
        ClusterName: !GetAtt Platform.Outputs.ClusterName
        ServiceName: !GetAtt Platform.Outputs.ServiceName
        ProductionListenerArn: !GetAtt Platform.Outputs.ProductionListenerArn
        TestListenerArn: !GetAtt Platform.Outputs.TestListenerArn
        BlueTargetGroupName: !GetAtt Platform.Outputs.BlueTargetGroupName
        GreenTargetGroupName: !GetAtt Platform.Outputs.GreenTargetGroupName
        Target5xxAlarmName: !GetAtt Platform.Outputs.Target5xxAlarmName
        TaskFamily: !Ref ProjectName
        TaskExecutionRoleArn: !GetAtt Platform.Outputs.TaskExecutionRoleArn
        TaskRoleArn: !GetAtt Platform.Outputs.TaskRoleArn
        ContainerPort: !Ref ContainerPort
        TaskCpu: !Ref TaskCpu
        TaskMemory: !Ref TaskMemory
        LogGroupName: !GetAtt Platform.Outputs.LogGroupName
        DatabaseUrlParameterArn: !GetAtt Data.Outputs.DatabaseUrlParameterArn
        CacheHostParameterArn: !GetAtt Data.Outputs.CacheHostParameterArn
        CachePortParameterArn: !GetAtt Data.Outputs.CachePortParameterArn
        DatabaseSecretArn: !GetAtt Data.Outputs.DatabaseSecretArn
        RedisSecretArn: !GetAtt Data.Outputs.RedisSecretArn
        CacheTls: !GetAtt Data.Outputs.CacheTransitEncryption
        ConnectionArn:
          Fn::ImportValue: !Sub '${ProjectName}-github-connection-arn'
        ApplicationRepositoryId: !Sub '${GitHubOwner}/${ApplicationRepo}'
      Tags:
        - Key: nested-stack
          Value: delivery

Outputs:
  ApplicationUrl:
    Condition: HasImage
    Description: Public ALB endpoint - the lab deliverable
    Value: !GetAtt Platform.Outputs.LoadBalancerUrl
  TestListenerUrl:
    Condition: HasImage
    Description: Green fleet during a blue/green shift, before traffic moves
    Value: !GetAtt Platform.Outputs.TestListenerUrl

  # The two values the application repository still holds. Everything else it
  # used to be told is either committed in taskdef.json or read at run time
  # from a fixed SSM path, so it is no longer copied anywhere.
  ApplicationRoleArn:
    Description: Value for the AWS_ECR_ROLE_ARN secret in the application repository
    Value: !GetAtt Registry.Outputs.GitHubActionsRoleArn
  EcrRepositoryName:
    Description: Value for the ECR_REPOSITORY variable in the application repository
    Value: !GetAtt Registry.Outputs.RepositoryName

  # Values injected into the deployment task definition by CodeBuild.
  TaskFamily:
    Description: family in taskdef.json
    Value: !Ref ProjectName
  TaskExecutionRoleArn:
    Condition: HasImage
    Description: executionRoleArn in taskdef.json
    Value: !GetAtt Platform.Outputs.TaskExecutionRoleArn
  TaskRoleArn:
    Condition: HasImage
    Description: taskRoleArn in taskdef.json
    Value: !GetAtt Platform.Outputs.TaskRoleArn
  LogGroupName:
    Condition: HasImage
    Description: awslogs-group in taskdef.json
    Value: !GetAtt Platform.Outputs.LogGroupName
  DatabaseUrlParameterArn:
    Description: valueFrom for SPRING_DATASOURCE_URL in taskdef.json
    Value: !GetAtt Data.Outputs.DatabaseUrlParameterArn
  CacheHostParameterArn:
    Description: valueFrom for SPRING_DATA_REDIS_HOST in taskdef.json
    Value: !GetAtt Data.Outputs.CacheHostParameterArn
  CachePortParameterArn:
    Description: valueFrom for SPRING_DATA_REDIS_PORT in taskdef.json
    Value: !GetAtt Data.Outputs.CachePortParameterArn
  # Diagnostics.
  DatabaseUrl:
    Description: Resolved JDBC URL - the proxy, not the instance
    Value: !GetAtt Data.Outputs.DatabaseUrl
  DatabaseEndpoint:
    Description: Instance endpoint - reachable only from the proxy
    Value: !GetAtt Data.Outputs.DatabaseEndpoint
  ProxyEndpoint:
    Value: !GetAtt Data.Outputs.ProxyEndpoint
  CacheHost:
    Value: !GetAtt Data.Outputs.CachePrimaryEndpoint
  DatabaseSecretArn:
    Description: Full ARN, for reading the credentials by hand
    Value: !GetAtt Data.Outputs.DatabaseSecretArn
  RedisSecretArn:
    Value: !GetAtt Data.Outputs.RedisSecretArn
  RepositoryUri:
    Description: Image URI the application workflow pushes to
    Value: !GetAtt Registry.Outputs.RepositoryUri
  VpcId:
    Value: !GetAtt Network.Outputs.VpcId
  ArtifactBucketName:
    Condition: HasImage
    Description: Pipeline artifact store
    Value: !GetAtt Delivery.Outputs.ArtifactBucketName
  PipelineName:
    Condition: HasImage
    Value: !GetAtt Delivery.Outputs.PipelineName
  ClusterName:
    Condition: HasImage
    Value: !GetAtt Platform.Outputs.ClusterName
  ServiceName:
    Condition: HasImage
    Value: !GetAtt Platform.Outputs.ServiceName
