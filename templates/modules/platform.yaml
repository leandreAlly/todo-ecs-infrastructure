AWSTemplateFormatVersion: '2010-09-09'
Description: >
  To-Do ECS - runtime platform.
  A public Application Load Balancer in the public subnets fronting an ECS
  Fargate service in the app subnets. Two target groups exist so CodeDeploy can
  shift traffic blue/green, and the service is created with the CODE_DEPLOY
  deployment controller so CloudFormation stops managing which task definition
  is live once CodeDeploy takes over. The task definition here is only the one
  the service is born with; every later revision comes from taskdef.json in the
  application repository, so the two must be kept in step.

Parameters:
  ProjectName:
    Type: String
    Default: todo-ecs

  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  AppSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  AlbSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  TaskSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

  ContainerImage:
    Type: String
  ContainerPort:
    Type: Number
    Default: 8080
  TestListenerPort:
    Type: Number
    Default: 9000

  DatabaseUrl:
    Type: String
  DatabaseSecretArn:
    Type: String
  CacheHost:
    Type: String
  CachePort:
    Type: String
  CacheTls:
    Type: String
    Default: 'true'
  CacheTtlSeconds:
    Type: String
    Default: '30'

  TaskCpu:
    Type: String
    Default: '512'
    AllowedValues: ['256', '512', '1024', '2048']
  TaskMemory:
    Type: String
    Default: '1024'

  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
  MinCapacity:
    Type: Number
    Default: 1
    MinValue: 1
  MaxCapacity:
    Type: Number
    Default: 4
    MinValue: 1
  CpuTargetUtilization:
    Type: Number
    Default: 60
    MinValue: 10
    MaxValue: 90

  HealthCheckPath:
    Type: String
    Default: /health
    Description: >
      Deliberately a shallow check. It must not touch the database or the
      cache: if it did, a brief RDS failover would fail every task in the
      production target group at once and the ALB would drain the whole fleet
      over an outage the application is designed to ride out.
  LogRetentionDays:
    Type: Number
    Default: 7

Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${ProjectName}'
      RetentionInDays: !Ref LogRetentionDays

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings:
        - Name: containerInsights
          Value: disabled
      Tags:
        - Key: project
          Value: !Ref ProjectName

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Pulls the image from ECR, writes container logs and reads the database secret
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadDatabaseSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: InjectDatabaseCredentials
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DatabaseSecretArn
      Tags:
        - Key: project
          Value: !Ref ProjectName

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      Description: >
        Identity the application runs as. It talks to PostgreSQL and Redis over
        the network with credentials handed to it at start-up, so it calls no
        AWS API and needs no permissions of its own.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: project
          Value: !Ref ProjectName

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref ProjectName
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: app
          Image: !Ref ContainerImage
          Essential: true
          StopTimeout: 60
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          Environment:
            - Name: SPRING_DATASOURCE_URL
              Value: !Ref DatabaseUrl
            - Name: SPRING_DATA_REDIS_HOST
              Value: !Ref CacheHost
            - Name: SPRING_DATA_REDIS_PORT
              Value: !Ref CachePort
            - Name: SPRING_DATA_REDIS_SSL_ENABLED
              Value: !Ref CacheTls
            - Name: APP_CACHE_ENABLED
              Value: 'true'
            - Name: APP_CACHE_TTL_SECONDS
              Value: !Ref CacheTtlSeconds
          Secrets:
            - Name: SPRING_DATASOURCE_USERNAME
              ValueFrom: !Sub '${DatabaseSecretArn}:username::'
            - Name: SPRING_DATASOURCE_PASSWORD
              ValueFrom: !Sub '${DatabaseSecretArn}:password::'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app
      Tags:
        - Key: project
          Value: !Ref ProjectName

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets: !Ref PublicSubnetIds
      SecurityGroups:
        - !Ref AlbSecurityGroupId
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: '60'
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
      Tags:
        - Key: project
          Value: !Ref ProjectName

  BlueTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: !Ref ContainerPort
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 10
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
        # slow_start and least_outstanding_requests are mutually exclusive on a
        # target group. Slow start is the one that matters here: it ramps
        # traffic into a task that has just passed its health check but is
        # still interpreting bytecode, which is exactly when a JVM is slowest.
        - Key: slow_start.duration_seconds
          Value: '60'
      Tags:
        - Key: colour
          Value: blue

  GreenTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Port: !Ref ContainerPort
      Protocol: HTTP
      TargetType: ip
      HealthCheckPath: !Ref HealthCheckPath
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 10
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: '30'
        # slow_start and least_outstanding_requests are mutually exclusive on a
        # target group. Slow start is the one that matters here: it ramps
        # traffic into a task that has just passed its health check but is
        # still interpreting bytecode, which is exactly when a JVM is slowest.
        - Key: slow_start.duration_seconds
          Value: '60'
      Tags:
        - Key: colour
          Value: green

  ProductionListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref BlueTargetGroup

  TestListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: !Ref TestListenerPort
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref GreenTargetGroup

  Service:
    Type: AWS::ECS::Service
    DependsOn:
      - ProductionListener
      - TestListener
    Properties:
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      PlatformVersion: LATEST
      DesiredCount: !Ref DesiredCount
      DeploymentController:
        Type: CODE_DEPLOY
      # A cold JVM behind an ECR interface endpoint needs well over a minute
      # before it answers the first health check. Too short a grace period and
      # ECS starts killing tasks mid-start-up, which surfaces as a CodeDeploy
      # failure with no useful cause.
      HealthCheckGracePeriodSeconds: 180
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref AppSubnetIds
          SecurityGroups:
            - !Ref TaskSecurityGroupId
      LoadBalancers:
        - ContainerName: app
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref BlueTargetGroup
      Tags:
        - Key: project
          Value: !Ref ProjectName

  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub 'service/${Cluster}/${Service.Name}'
      MinCapacity: !Ref MinCapacity
      MaxCapacity: !Ref MaxCapacity

  CpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${ProjectName}-cpu-target-tracking'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: !Ref CpuTargetUtilization
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

Outputs:
  LoadBalancerUrl:
    Description: Public endpoint for the application
    Value: !Sub 'http://${LoadBalancer.DNSName}'
  TestListenerUrl:
    Description: Green fleet during a shift, before production traffic moves
    Value: !Sub 'http://${LoadBalancer.DNSName}:${TestListenerPort}'
  LoadBalancerDnsName:
    Value: !GetAtt LoadBalancer.DNSName
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  TaskDefinitionArn:
    Value: !Ref TaskDefinition
  TaskExecutionRoleArn:
    Value: !GetAtt TaskExecutionRole.Arn
  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn
  BlueTargetGroupName:
    Value: !GetAtt BlueTargetGroup.TargetGroupName
  GreenTargetGroupName:
    Value: !GetAtt GreenTargetGroup.TargetGroupName
  ProductionListenerArn:
    Value: !Ref ProductionListener
  TestListenerArn:
    Value: !Ref TestListener
  LogGroupName:
    Value: !Ref LogGroup
