AWSTemplateFormatVersion: '2010-09-09'
Description: >
  To-Do ECS - data tier.
  A Multi-AZ PostgreSQL instance in the data subnets, fronted by RDS Proxy so
  the application never holds a connection to the instance itself, and a
  two-node Redis replication group in the cache subnets. Database and Redis
  credentials are generated by Secrets Manager and injected only where needed:
  the proxy reads the database secret with its own role, and ECS injects both
  secrets into the container. This stack is created on the first deploy,
  before any image exists, because the
  database and cache take far longer to come up than the service does.

Parameters:
  ProjectName:
    Type: String
    Default: todo-ecs
    AllowedPattern: '[a-z][a-z0-9-]*'

  DataSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  CacheSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  DatabaseSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  ProxySecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  CacheSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id

  DbName:
    Type: String
    Default: todo
    AllowedPattern: '[a-zA-Z][a-zA-Z0-9_]*'
  DbMasterUsername:
    Type: String
    Default: todoadmin
    AllowedPattern: '[a-z][a-z0-9_]*'
  DbPort:
    Type: Number
    Default: 5432
  DbEngineVersion:
    Type: String
    Default: '17.6'
  DbInstanceClass:
    Type: String
    Default: db.t3.micro
  DbAllocatedStorage:
    Type: Number
    Default: 20
    MinValue: 20
    MaxValue: 200
  DbMultiAZ:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
  DbBackupRetentionDays:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 35

  CacheNodeType:
    Type: String
    Default: cache.t4g.micro
  CacheEngineVersion:
    Type: String
    Default: '7.1'
  CacheClusterCount:
    Type: Number
    Default: 2
    MinValue: 2
    MaxValue: 6
    Description: >
      Total nodes in the replication group, one of which is the primary. Two
      nodes across two AZs is the smallest configuration that can fail over.
  CachePort:
    Type: Number
    Default: 6379
  CacheParameterGroup:
    Type: String
    Default: default.redis7

  DbSslMode:
    Type: String
    Default: verify-full
    AllowedValues: [verify-full, require]
    Description: >
      verify-full checks the proxy certificate, which works with no truststore
      of our own because RDS Proxy presents an ACM certificate and pgjdbc is
      pointed at the JVM trust store. Drop to require if the endpoint is ever
      reached through a name the certificate does not cover.

Resources:
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ProjectName}-db-credentials'
      Description: !Sub 'Master credentials for the ${ProjectName} PostgreSQL instance'
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${DbMasterUsername}"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: layer
          Value: data
        - Key: lab
          Value: advanced-ecs
        - Key: owner
          Value: leandre
        - Key: managed-by
          Value: cloudformation-gitsync

  RedisSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ProjectName}-redis-auth'
      Description: !Sub 'Auth token for the ${ProjectName} Redis cache'
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: token
        PasswordLength: 32
        ExcludePunctuation: true
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: layer
          Value: data
        - Key: lab
          Value: advanced-ecs
        - Key: owner
          Value: leandre
        - Key: managed-by
          Value: cloudformation-gitsync

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: !Sub '${ProjectName}-db-subnets'
      DBSubnetGroupDescription: Dedicated data-tier subnets, one per availability zone
      SubnetIds: !Ref DataSubnetIds
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: lab
          Value: advanced-ecs
        - Key: owner
          Value: leandre
        - Key: managed-by
          Value: cloudformation-gitsync
        - Key: layer
          Value: data

  DatabaseLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/rds/instance/${ProjectName}-db/postgresql'
      RetentionInDays: 7
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: lab
          Value: advanced-ecs
        - Key: owner
          Value: leandre
        - Key: managed-by
          Value: cloudformation-gitsync
        - Key: layer
          Value: data

  Database:
    Type: AWS::RDS::DBInstance
    DependsOn: DatabaseLogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub '${ProjectName}-db'
      Engine: postgres
      EngineVersion: !Ref DbEngineVersion
      DBInstanceClass: !Ref DbInstanceClass
      DBName: !Ref DbName
      Port: !Ref DbPort
      MasterUsername: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}'
      AllocatedStorage: !Ref DbAllocatedStorage
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: !Ref DbMultiAZ
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups:
        - !Ref DatabaseSecurityGroupId
      PubliclyAccessible: false
      BackupRetentionPeriod: !Ref DbBackupRetentionDays
      CopyTagsToSnapshot: true
      AutoMinorVersionUpgrade: true
      DeletionProtection: false
      EnableCloudwatchLogsExports:
        - postgresql
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: layer
          Value: data
        - Key: lab
          Value: advanced-ecs
        - Key: owner
          Value: leandre
        - Key: managed-by
          Value: cloudformation-gitsync

  DatabaseSecretAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref DatabaseSecret
      TargetId: !Ref Database
      TargetType: AWS::RDS::DBInstance

  # The proxy authenticates to PostgreSQL on the application's behalf, so it -
  # not the task - is what reads the secret. Secret retrieval for the managed
  # proxy service does not require a VPC endpoint in the data subnets.
  ProxyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-rds-proxy-role'
      Description: Lets RDS Proxy read the database credentials
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: rds.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: ReadDatabaseSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadSecret
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource: !Ref DatabaseSecret
              - Sid: DecryptWithDefaultKey
                Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'secretsmanager.${AWS::Region}.amazonaws.com'
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: lab
          Value: advanced-ecs
        - Key: owner
          Value: leandre
        - Key: managed-by
          Value: cloudformation-gitsync
        - Key: layer
          Value: data

  # The proxy validates the secret as it is created, so it has to wait for the
  # attachment to write the final version containing the host and port.
  Proxy:
    Type: AWS::RDS::DBProxy
    DependsOn: DatabaseSecretAttachment
    Properties:
      DBProxyName: !Sub '${ProjectName}-proxy'
      EngineFamily: POSTGRESQL
      RoleArn: !GetAtt ProxyRole.Arn
      RequireTLS: true
      IdleClientTimeout: 1800
      DebugLogging: false
      Auth:
        - AuthScheme: SECRETS
          SecretArn: !Ref DatabaseSecret
          IAMAuth: DISABLED
          Description: Master credentials, shared by the proxy and the application
      VpcSubnetIds: !Ref DataSubnetIds
      VpcSecurityGroupIds:
        - !Ref ProxySecurityGroupId
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: layer
          Value: data
        - Key: lab
          Value: advanced-ecs
        - Key: owner
          Value: leandre
        - Key: managed-by
          Value: cloudformation-gitsync

  # "default" is the only target group name RDS Proxy accepts.
  ProxyTargetGroup:
    Type: AWS::RDS::DBProxyTargetGroup
    DependsOn: DatabaseSecretAttachment
    Properties:
      DBProxyName: !Ref Proxy
      TargetGroupName: default
      DBInstanceIdentifiers:
        - !Ref Database
      ConnectionPoolConfigurationInfo:
        MaxConnectionsPercent: 90
        MaxIdleConnectionsPercent: 50
        ConnectionBorrowTimeout: 120

  CacheSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      CacheSubnetGroupName: !Sub '${ProjectName}-cache-subnets'
      Description: Dedicated cache-tier subnets, one per availability zone
      SubnetIds: !Ref CacheSubnetIds
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: lab
          Value: advanced-ecs
        - Key: owner
          Value: leandre
        - Key: managed-by
          Value: cloudformation-gitsync
        - Key: layer
          Value: data

  Cache:
    Type: AWS::ElastiCache::ReplicationGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      ReplicationGroupId: !Sub '${ProjectName}-redis'
      ReplicationGroupDescription: !Sub 'Read cache for the ${ProjectName} task list'
      Engine: redis
      EngineVersion: !Ref CacheEngineVersion
      CacheNodeType: !Ref CacheNodeType
      CacheParameterGroupName: !Ref CacheParameterGroup
      NumCacheClusters: !Ref CacheClusterCount
      AutomaticFailoverEnabled: true
      MultiAZEnabled: true
      CacheSubnetGroupName: !Ref CacheSubnetGroup
      SecurityGroupIds:
        - !Ref CacheSecurityGroupId
      Port: !Ref CachePort
      AtRestEncryptionEnabled: true
      TransitEncryptionEnabled: true
      # Replacing RedisSecret changes this value, and CloudFormation has no
      # AuthTokenUpdateStrategy property to steer how ElastiCache applies it -
      # that setting exists only on the ModifyReplicationGroup API. Treat a
      # change to the secret as a change that needs the tasks redeployed
      # behind it, and watch the cache health check across the update.
      AuthToken: !Sub '{{resolve:secretsmanager:${RedisSecret}:SecretString:token}}'
      AutoMinorVersionUpgrade: true
      SnapshotRetentionLimit: 0
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: lab
          Value: advanced-ecs
        - Key: owner
          Value: leandre
        - Key: managed-by
          Value: cloudformation-gitsync
        - Key: layer
          Value: data

  # Every endpoint in this stack is generated by AWS, so none of them can be
  # written into a task definition that is committed to Git. Publishing them at
  # fixed parameter paths gives the task definition something stable to point
  # at: the parameter ARN is derived from the path alone, so it survives a
  # rebuild that changes every endpoint behind it.
  DatabaseUrlParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/db-url'
      Type: String
      Description: JDBC URL for the RDS Proxy endpoint
      Value: !Sub 'jdbc:postgresql://${Proxy.Endpoint}:${DbPort}/${DbName}?sslmode=${DbSslMode}&sslfactory=org.postgresql.ssl.DefaultJavaSSLFactory&assumeMinServerVersion=9.0&prepareThreshold=0&tcpKeepAlive=true&ApplicationName=${ProjectName}'
      Tags:
        project: !Ref ProjectName
        lab: advanced-ecs
        owner: leandre
        managed-by: cloudformation-gitsync
        layer: data

  CacheHostParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/redis-host'
      Type: String
      Description: Primary endpoint of the Redis replication group
      Value: !GetAtt Cache.PrimaryEndPoint.Address
      Tags:
        project: !Ref ProjectName
        lab: advanced-ecs
        owner: leandre
        managed-by: cloudformation-gitsync
        layer: data

  CachePortParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub '/${ProjectName}/redis-port'
      Type: String
      Description: Port of the Redis replication group
      Value: !GetAtt Cache.PrimaryEndPoint.Port
      Tags:
        project: !Ref ProjectName
        lab: advanced-ecs
        owner: leandre
        managed-by: cloudformation-gitsync
        layer: data

Outputs:
  DatabaseSecretArn:
    Description: Full ARN of the database credentials
    Value: !Ref DatabaseSecret
  RedisSecretArn:
    Description: Full ARN of the cache auth token
    Value: !Ref RedisSecret
  DatabaseUrlParameterArn:
    Description: Value the committed task definition names for SPRING_DATASOURCE_URL
    Value: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/db-url'
  CacheHostParameterArn:
    Value: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/redis-host'
  CachePortParameterArn:
    Value: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${ProjectName}/redis-port'
  DatabaseEndpoint:
    Description: Instance address - only the proxy can reach it
    Value: !GetAtt Database.Endpoint.Address
  DatabaseName:
    Value: !Ref DbName
  ProxyEndpoint:
    Value: !GetAtt Proxy.Endpoint
  DatabaseUrl:
    Description: >
      JDBC URL for the application. It points at the proxy, never the instance.
      TLS is mandatory because the proxy sets RequireTLS. The three parameters
      after it exist to stop the proxy pinning a session to one backend
      connection, which would defeat the pooling this whole tier is for:
      assumeMinServerVersion skips the startup SET, prepareThreshold=0 stops
      pgjdbc creating named server-side prepared statements, and ApplicationName
      is sent in the startup packet rather than as a SET.
    Value: !Sub 'jdbc:postgresql://${Proxy.Endpoint}:${DbPort}/${DbName}?sslmode=${DbSslMode}&sslfactory=org.postgresql.ssl.DefaultJavaSSLFactory&assumeMinServerVersion=9.0&prepareThreshold=0&tcpKeepAlive=true&ApplicationName=${ProjectName}'
  CachePrimaryEndpoint:
    Description: Value for REDIS_HOST in the application repository
    Value: !GetAtt Cache.PrimaryEndPoint.Address
  CacheReaderEndpoint:
    Value: !GetAtt Cache.ReaderEndPoint.Address
  CachePort:
    Description: Value for REDIS_PORT in the application repository
    Value: !GetAtt Cache.PrimaryEndPoint.Port
  CacheTransitEncryption:
    Description: Value for REDIS_SSL in the application repository
    Value: 'true'
