AWSTemplateFormatVersion: '2010-09-09'
Description: >
  To-Do ECS - network foundation.
  A two-AZ VPC with four dedicated tiers: public subnets for the load balancer,
  app subnets for ECS tasks, data subnets for RDS and its proxy, and cache
  subnets for ElastiCache. Nothing private has a route to the internet - there
  is no NAT gateway, so tasks reach ECR, S3, CloudWatch Logs and Secrets
  Manager through VPC endpoints instead. This stack owns every security group
  so the rules can reference each other without cross-stack circularity.

Parameters:
  ProjectName:
    Type: String
    Default: todo-ecs
    AllowedPattern: '[a-z][a-z0-9-]*'

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
  PublicSubnet1Cidr:
    Type: String
    Default: 10.0.0.0/24
  PublicSubnet2Cidr:
    Type: String
    Default: 10.0.1.0/24
  AppSubnet1Cidr:
    Type: String
    Default: 10.0.10.0/24
  AppSubnet2Cidr:
    Type: String
    Default: 10.0.11.0/24
  DataSubnet1Cidr:
    Type: String
    Default: 10.0.20.0/24
  DataSubnet2Cidr:
    Type: String
    Default: 10.0.21.0/24
  CacheSubnet1Cidr:
    Type: String
    Default: 10.0.30.0/24
  CacheSubnet2Cidr:
    Type: String
    Default: 10.0.31.0/24

  ContainerPort:
    Type: Number
    Default: 8080
    MinValue: 1
    MaxValue: 65535
  TestListenerPort:
    Type: Number
    Default: 9000
    MinValue: 1
    MaxValue: 65535
  TestListenerCidr:
    Type: String
    Default: 127.0.0.1/32
    Description: Operator public CIDR allowed to reach the CodeDeploy test listener; override with the current public IP/32.
  DatabasePort:
    Type: Number
    Default: 5432
    MinValue: 1
    MaxValue: 65535
  CachePort:
    Type: Number
    Default: 6379
    MinValue: 1
    MaxValue: 65535

  S3PrefixListId:
    Type: String
    AllowedPattern: '^pl-[0-9a-f]+$'
    Description: >
      Managed prefix list for S3 in this region. Find it with:
      aws ec2 describe-managed-prefix-lists --region <region>
      --filters Name=prefix-list-name,Values=com.amazonaws.<region>.s3
      --query 'PrefixLists[0].PrefixListId' --output text

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-vpc'
        - Key: project
          Value: !Ref ProjectName
        - Key: lab
          Value: advanced-ecs
        - Key: owner
          Value: leandre
        - Key: managed-by
          Value: cloudformation-gitsync
        - Key: layer
          Value: network

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-igw'
        - Key: project
          Value: !Ref ProjectName
        - Key: lab
          Value: advanced-ecs
        - Key: owner
          Value: leandre
        - Key: managed-by
          Value: cloudformation-gitsync
        - Key: layer
          Value: network

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public-1'
        - Key: Tier
          Value: public
        - Key: project
          Value: !Ref ProjectName
        - Key: lab
          Value: advanced-ecs
        - Key: owner
          Value: leandre
        - Key: managed-by
          Value: cloudformation-gitsync
        - Key: layer
          Value: network

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public-2'
        - Key: Tier
          Value: public
        - Key: project
          Value: !Ref ProjectName
        - Key: lab
          Value: advanced-ecs
        - Key: owner
          Value: leandre
        - Key: managed-by
          Value: cloudformation-gitsync
        - Key: layer
          Value: network

  AppSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref AppSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-app-1'
        - Key: Tier
          Value: app
        - Key: project
          Value: !Ref ProjectName
        - Key: lab
          Value: advanced-ecs
        - Key: owner
          Value: leandre
        - Key: managed-by
          Value: cloudformation-gitsync
        - Key: layer
          Value: network

  AppSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref AppSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-app-2'
        - Key: Tier
          Value: app
        - Key: project
          Value: !Ref ProjectName
        - Key: lab
          Value: advanced-ecs
        - Key: owner
          Value: leandre
        - Key: managed-by
          Value: cloudformation-gitsync
        - Key: layer
          Value: network

  DataSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref DataSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-data-1'
        - Key: Tier
          Value: data
        - Key: project
          Value: !Ref ProjectName
        - Key: lab
          Value: advanced-ecs
        - Key: owner
          Value: leandre
        - Key: managed-by
          Value: cloudformation-gitsync
        - Key: layer
          Value: network

  DataSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref DataSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-data-2'
        - Key: Tier
          Value: data
        - Key: project
          Value: !Ref ProjectName
        - Key: lab
          Value: advanced-ecs
        - Key: owner
          Value: leandre
        - Key: managed-by
          Value: cloudformation-gitsync
        - Key: layer
          Value: network

  CacheSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref CacheSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-cache-1'
        - Key: Tier
          Value: cache
        - Key: project
          Value: !Ref ProjectName
        - Key: lab
          Value: advanced-ecs
        - Key: owner
          Value: leandre
        - Key: managed-by
          Value: cloudformation-gitsync
        - Key: layer
          Value: network

  CacheSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref CacheSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-cache-2'
        - Key: Tier
          Value: cache
        - Key: project
          Value: !Ref ProjectName
        - Key: lab
          Value: advanced-ecs
        - Key: owner
          Value: leandre
        - Key: managed-by
          Value: cloudformation-gitsync
        - Key: layer
          Value: network

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public-rt'
        - Key: project
          Value: !Ref ProjectName
        - Key: lab
          Value: advanced-ecs
        - Key: owner
          Value: leandre
        - Key: managed-by
          Value: cloudformation-gitsync
        - Key: layer
          Value: network

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  AppRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-app-rt-1'
        - Key: project
          Value: !Ref ProjectName
        - Key: lab
          Value: advanced-ecs
        - Key: owner
          Value: leandre
        - Key: managed-by
          Value: cloudformation-gitsync
        - Key: layer
          Value: network

  AppRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-app-rt-2'
        - Key: project
          Value: !Ref ProjectName
        - Key: lab
          Value: advanced-ecs
        - Key: owner
          Value: leandre
        - Key: managed-by
          Value: cloudformation-gitsync
        - Key: layer
          Value: network

  AppSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnet1
      RouteTableId: !Ref AppRouteTable1

  AppSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref AppSubnet2
      RouteTableId: !Ref AppRouteTable2

  DataRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-data-rt'
        - Key: project
          Value: !Ref ProjectName
        - Key: lab
          Value: advanced-ecs
        - Key: owner
          Value: leandre
        - Key: managed-by
          Value: cloudformation-gitsync
        - Key: layer
          Value: network

  DataSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DataSubnet1
      RouteTableId: !Ref DataRouteTable

  DataSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DataSubnet2
      RouteTableId: !Ref DataRouteTable

  CacheRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-cache-rt'
        - Key: project
          Value: !Ref ProjectName
        - Key: lab
          Value: advanced-ecs
        - Key: owner
          Value: leandre
        - Key: managed-by
          Value: cloudformation-gitsync
        - Key: layer
          Value: network

  CacheSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref CacheSubnet1
      RouteTableId: !Ref CacheRouteTable

  CacheSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref CacheSubnet2
      RouteTableId: !Ref CacheRouteTable

  # Every security group declares its egress inline so the permissive
  # "allow all outbound" rule EC2 adds by default is replaced. Egress therefore
  # has to form a DAG - alb -> task -> {endpoint, proxy, cache} and
  # proxy -> database - while ingress is attached as standalone
  # resources, which can never create a cycle. Groups that legitimately need no
  # outbound access carry a single unreachable rule to hold that position.

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public entry point - accepts HTTP from the internet
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Production listener
        - IpProtocol: tcp
          FromPort: !Ref TestListenerPort
          ToPort: !Ref TestListenerPort
          CidrIp: !Ref TestListenerCidr
          Description: CodeDeploy test listener for blue/green validation
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: !Ref ContainerPort
          ToPort: !Ref ContainerPort
          DestinationSecurityGroupId: !Ref TaskSecurityGroup
          Description: Forward requests to ECS tasks
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-alb-sg'
        - Key: Tier
          Value: public
        - Key: project
          Value: !Ref ProjectName
        - Key: lab
          Value: advanced-ecs
        - Key: owner
          Value: leandre
        - Key: managed-by
          Value: cloudformation-gitsync
        - Key: layer
          Value: network

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS Fargate tasks - reachable only from the load balancer
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          DestinationSecurityGroupId: !Ref VpcEndpointSecurityGroup
          Description: ECR, CloudWatch Logs, Secrets Manager and SSM over interface endpoints
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          DestinationPrefixListId: !Ref S3PrefixListId
          Description: ECR image layers live in S3, reached via the gateway endpoint
        - IpProtocol: tcp
          FromPort: !Ref DatabasePort
          ToPort: !Ref DatabasePort
          DestinationSecurityGroupId: !Ref ProxySecurityGroup
          Description: PostgreSQL through RDS Proxy - never straight to the instance
        - IpProtocol: tcp
          FromPort: !Ref CachePort
          ToPort: !Ref CachePort
          DestinationSecurityGroupId: !Ref CacheSecurityGroup
          Description: Redis reads and cache invalidation
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-task-sg'
        - Key: Tier
          Value: app
        - Key: project
          Value: !Ref ProjectName
        - Key: lab
          Value: advanced-ecs
        - Key: owner
          Value: leandre
        - Key: managed-by
          Value: cloudformation-gitsync
        - Key: layer
          Value: network

  VpcEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Interface VPC endpoints - HTTPS from tasks and the proxy only
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 127.0.0.1/32
          Description: Endpoints never originate traffic
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-endpoint-sg'
        - Key: Tier
          Value: app
        - Key: project
          Value: !Ref ProjectName
        - Key: lab
          Value: advanced-ecs
        - Key: owner
          Value: leandre
        - Key: managed-by
          Value: cloudformation-gitsync
        - Key: layer
          Value: network

  ProxySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS Proxy - the only path from the application to the database
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: !Ref DatabasePort
          ToPort: !Ref DatabasePort
          DestinationSecurityGroupId: !Ref DatabaseSecurityGroup
          Description: Pooled connections to the PostgreSQL instance
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-proxy-sg'
        - Key: Tier
          Value: data
        - Key: project
          Value: !Ref ProjectName
        - Key: lab
          Value: advanced-ecs
        - Key: owner
          Value: leandre
        - Key: managed-by
          Value: cloudformation-gitsync
        - Key: layer
          Value: network

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS PostgreSQL - accepts connections from RDS Proxy only
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 127.0.0.1/32
          Description: The database never originates traffic
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-db-sg'
        - Key: Tier
          Value: data
        - Key: project
          Value: !Ref ProjectName
        - Key: lab
          Value: advanced-ecs
        - Key: owner
          Value: leandre
        - Key: managed-by
          Value: cloudformation-gitsync
        - Key: layer
          Value: network

  CacheSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ElastiCache Redis - accepts connections from ECS tasks only
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 127.0.0.1/32
          Description: Replaced by the replication rule below
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-cache-sg'
        - Key: Tier
          Value: cache
        - Key: project
          Value: !Ref ProjectName
        - Key: lab
          Value: advanced-ecs
        - Key: owner
          Value: leandre
        - Key: managed-by
          Value: cloudformation-gitsync
        - Key: layer
          Value: network

  TaskIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref TaskSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref ContainerPort
      ToPort: !Ref ContainerPort
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: Application traffic and health checks from the ALB

  EndpointIngressFromTasks:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref VpcEndpointSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref TaskSecurityGroup
      Description: HTTPS from ECS tasks

  ProxyIngressFromTasks:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ProxySecurityGroup
      IpProtocol: tcp
      FromPort: !Ref DatabasePort
      ToPort: !Ref DatabasePort
      SourceSecurityGroupId: !Ref TaskSecurityGroup
      Description: PostgreSQL from ECS tasks

  DatabaseIngressFromProxy:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DatabaseSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref DatabasePort
      ToPort: !Ref DatabasePort
      SourceSecurityGroupId: !Ref ProxySecurityGroup
      Description: PostgreSQL from RDS Proxy - tasks have no direct route

  CacheIngressFromTasks:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref CacheSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref CachePort
      ToPort: !Ref CachePort
      SourceSecurityGroupId: !Ref TaskSecurityGroup
      Description: Redis from ECS tasks

  CacheIngressFromCache:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref CacheSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref CachePort
      ToPort: !Ref CachePort
      SourceSecurityGroupId: !Ref CacheSecurityGroup
      Description: Primary to replica replication inside the replication group

  CacheEgressToCache:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref CacheSecurityGroup
      IpProtocol: tcp
      FromPort: !Ref CachePort
      ToPort: !Ref CachePort
      DestinationSecurityGroupId: !Ref CacheSecurityGroup
      Description: Primary to replica replication inside the replication group

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref AppRouteTable1
        - !Ref AppRouteTable2
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: lab
          Value: advanced-ecs
        - Key: owner
          Value: leandre
        - Key: managed-by
          Value: cloudformation-gitsync
        - Key: layer
          Value: network

  EcrApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ecr.api'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref AppSubnet1
        - !Ref AppSubnet2
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: lab
          Value: advanced-ecs
        - Key: owner
          Value: leandre
        - Key: managed-by
          Value: cloudformation-gitsync
        - Key: layer
          Value: network

  EcrDkrEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ecr.dkr'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref AppSubnet1
        - !Ref AppSubnet2
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: lab
          Value: advanced-ecs
        - Key: owner
          Value: leandre
        - Key: managed-by
          Value: cloudformation-gitsync
        - Key: layer
          Value: network

  CloudWatchLogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.logs'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref AppSubnet1
        - !Ref AppSubnet2
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: lab
          Value: advanced-ecs
        - Key: owner
          Value: leandre
        - Key: managed-by
          Value: cloudformation-gitsync
        - Key: layer
          Value: network

  # For the task execution role, which reads the database secret when a task
  # starts and has no NAT gateway to reach the public endpoint. RDS Proxy also
  # reads that secret, but it does so from AWS-managed compute outside this
  # VPC, so the data subnets need no endpoint of their own.
  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.secretsmanager'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref AppSubnet1
        - !Ref AppSubnet2
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: lab
          Value: advanced-ecs
        - Key: owner
          Value: leandre
        - Key: managed-by
          Value: cloudformation-gitsync
        - Key: layer
          Value: network

  # The task execution role now also reads three SSM parameters when a task
  # starts - the database URL and the cache host and port, which are generated
  # by AWS and so cannot be written into a committed task definition. Same
  # reasoning as the Secrets Manager endpoint above: no NAT gateway, so the
  # call has to have somewhere inside the VPC to land. Without this, tasks fail
  # to start with a ResourceInitializationError naming the parameter.
  SsmEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ssm'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref AppSubnet1
        - !Ref AppSubnet2
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: lab
          Value: advanced-ecs
        - Key: owner
          Value: leandre
        - Key: managed-by
          Value: cloudformation-gitsync
        - Key: layer
          Value: network

Outputs:
  VpcId:
    Value: !Ref Vpc
  VpcCidr:
    Value: !GetAtt Vpc.CidrBlock
  PublicSubnetIds:
    Value: !Join [',', [!Ref PublicSubnet1, !Ref PublicSubnet2]]
  AppSubnetIds:
    Value: !Join [',', [!Ref AppSubnet1, !Ref AppSubnet2]]
  DataSubnetIds:
    Value: !Join [',', [!Ref DataSubnet1, !Ref DataSubnet2]]
  CacheSubnetIds:
    Value: !Join [',', [!Ref CacheSubnet1, !Ref CacheSubnet2]]
  AlbSecurityGroupId:
    Value: !Ref AlbSecurityGroup
  TaskSecurityGroupId:
    Value: !Ref TaskSecurityGroup
  ProxySecurityGroupId:
    Value: !Ref ProxySecurityGroup
  DatabaseSecurityGroupId:
    Value: !Ref DatabaseSecurityGroup
  CacheSecurityGroupId:
    Value: !Ref CacheSecurityGroup
  ContainerPort:
    Value: !Ref ContainerPort
  TestListenerPort:
    Value: !Ref TestListenerPort
  DatabasePort:
    Value: !Ref DatabasePort
  CachePort:
