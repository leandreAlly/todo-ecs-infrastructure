AWSTemplateFormatVersion: '2010-09-09'
Description: >
  To-Do ECS - container registry and the CI identity that writes to it.
  A private ECR repository with immutable commit tags and digest-pinned
  deployment artifacts, plus the IAM role the
  application repository's GitHub Actions workflow assumes through OIDC.
  Deployed before the platform stack because an ECS service cannot start
  without an image already present.

Parameters:
  ProjectName:
    Type: String
    Default: todo-ecs
    AllowedPattern: '[a-z][a-z0-9-]*'

  RepositoryName:
    Type: String
    Default: todo-ecs-app
    AllowedPattern: '[a-z0-9][a-z0-9._/-]*'

  GitHubOwner:
    Type: String
    Default: leandreAlly
  GitHubRepo:
    Type: String
    Default: todo-ecs-app

  GitHubOwnerId:
    Type: String
    Default: '78492995'
    AllowedPattern: '[0-9]+'
    Description: >
      Numeric GitHub owner ID. Repositories created after 2026-07-15 emit an
      immutable OIDC subject claim of the form
      repo:owner@ownerid/repo@repoid:ref:... instead of repo:owner/repo:ref:...

Resources:
  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref RepositoryName
      ImageTagMutability: IMMUTABLE_WITH_EXCLUSION
      ImageTagMutabilityExclusionFilters:
        - ImageTagMutabilityExclusionFilterType: WILDCARD
          ImageTagMutabilityExclusionFilterValue: latest
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        # One policy, one rule. A repository has exactly one lifecycle policy,
        # and every image in it - the mutable "latest" tag, immutable commit
        # tags and the untagged layers left behind when "latest" moves -
        # is expired by this single count rule. The twenty most recent images
        # cover far more than the deployment history a rollback ever reaches
        # back through.
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Retain the 20 most recent images, expire the rest",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 20
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Name
          Value: !Ref RepositoryName
        - Key: project
          Value: !Ref ProjectName
        - Key: lab
          Value: advanced-ecs
        - Key: owner
          Value: leandre
        - Key: layer
          Value: registry
        - Key: managed-by
          Value: cloudformation-gitsync

  GitHubActionsEcrRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub 'Lets GitHub Actions in ${GitHubOwner}/${GitHubRepo} push images to ${RepositoryName}'
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub 'repo:${GitHubOwner}/${GitHubRepo}:ref:refs/heads/main'
                  - !Sub 'repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepo}@*:ref:refs/heads/main'
      Policies:
        - PolicyName: EcrPush
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AuthenticateToRegistry
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: PushToProjectRepositoryOnly
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:DescribeImages
                Resource: !Sub 'arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${RepositoryName}'
      Tags:
        - Key: project
          Value: !Ref ProjectName
        - Key: lab
          Value: advanced-ecs
        - Key: owner
          Value: leandre
        - Key: layer
          Value: registry
        - Key: managed-by
          Value: cloudformation-gitsync

Outputs:
  RepositoryName:
    Value: !Ref EcrRepository
  RepositoryUri:
    Value: !GetAtt EcrRepository.RepositoryUri
  RepositoryArn:
    Value: !GetAtt EcrRepository.Arn
  GitHubActionsRoleArn:
    Description: Value for the AWS_ECR_ROLE_ARN secret in the application repository
    Value: !GetAtt GitHubActionsEcrRole.Arn
